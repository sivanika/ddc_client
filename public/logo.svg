<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradients -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ea4a9"/>
      <stop offset="50%" stop-color="#6e757d"/>
      <stop offset="100%" stop-color="#495057"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="blueRibbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="150" cy="130" r="100" fill="url(#circleGrad)" stroke="#38bdf8" stroke-width="4" filter="url(#shadow)" />
  <circle cx="150" cy="130" r="92" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- D D Letters -->
  <text x="96" y="165" font-family="'Inter', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#0284c7" letter-spacing="-1">D</text>
  <text x="172" y="165" font-family="'Inter', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#0284c7" letter-spacing="-1">D</text>

  <!-- Caduceus Center Staff -->
  <g transform="translate(150, 130) scale(0.95)" filter="url(#shadow)">
    <!-- Wings at top of staff -->
    <path d="M-60,-45 C-45,-75 -15,-65 0,-45 C15,-65 45,-75 60,-45 C45,-40 25,-42 0,-30 C-25,-42 -45,-40 -60,-45 Z" fill="url(#silverGrad)" stroke="#0284c7" stroke-width="2"/>
    <path d="M-50,-38 C-35,-60 -10,-50 0,-35 C10,-50 35,-60 50,-38 C38,-35 20,-36 0,-25 C-20,-36 -38,-35 -50,-38 Z" fill="#ffffff" opacity="0.7"/>

    <!-- Central Rod / Staff -->
    <rect x="-3.5" y="-55" width="7" height="135" rx="3.5" fill="url(#silverGrad)" stroke="#0284c7" stroke-width="2"/>
    <circle cx="0" cy="-56" r="7" fill="url(#silverGrad)" stroke="#0284c7" stroke-width="2"/>
    <circle cx="0" cy="80" r="5" fill="url(#silverGrad)" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Entwined Snakes (Left and Right coils) -->
    <!-- First upper coil -->
    <path d="M-22,-20 C-22,-32 22,-32 22,-20 C22,-8 -22,-8 -22,4 C-22,16 22,16 22,28 C22,40 -22,40 -22,52 C-22,64 12,64 12,70" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M-22,-20 C-22,-32 22,-32 22,-20 C22,-8 -22,-8 -22,4 C-22,16 22,16 22,28 C22,40 -22,40 -22,52 C-22,64 12,64 12,70" 
          fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Second counter coil -->
    <path d="M22,-20 C22,-32 -22,-32 -22,-20 C-22,-8 22,-8 22,4 C22,16 -22,16 -22,28 C-22,40 22,40 22,52 C22,64 -12,64 -12,70" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M22,-20 C22,-32 -22,-32 -22,-20 C-22,-8 22,-8 22,4 C22,16 -22,16 -22,28 C-22,40 22,40 22,52 C22,64 -12,64 -12,70" 
          fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ornate Ribbon at Bottom with 'Diagnosis & Research' -->
  <!-- Left and right ribbon tails -->
  <path d="M25,240 L55,220 L60,250 L25,270 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <path d="M275,240 L245,220 L240,250 L275,270 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Main Banner Arc -->
  <path d="M40,240 Q150,275 260,240 Q250,205 150,215 Q50,205 40,240 Z" 
        fill="#ffffff" stroke="#0284c7" stroke-width="3.5" filter="url(#shadow)" />
  <path d="M44,242 Q150,273 256,242" fill="none" stroke="#38bdf8" stroke-width="1" />

  <!-- Ribbon Text -->
  <text x="150" y="244" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#0369a1" letter-spacing="1.2">
    Diagnosis &amp; Research
  </text>
</svg>
